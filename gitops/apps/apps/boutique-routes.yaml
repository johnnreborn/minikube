# wave 3: after the application and the Gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-routes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: apps
  source:
    repoURL: https://github.com/johnnreborn/minikube
    targetRevision: main
    path: apps/online-boutique/routes
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
