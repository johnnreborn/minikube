# wave -3: Prometheus Operator CRDs as their own chart, so ServiceMonitor layers (Phase 7) can rely on them.
# Server-side apply (4.6 MB of CRDs), never pruned.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 33.0.2
    helm:
      releaseName: prometheus-operator-crds
      valuesObject:
        crds:
          annotations:
            argocd.argoproj.io/sync-options: Prune=false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
