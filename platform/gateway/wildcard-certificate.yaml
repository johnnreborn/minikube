apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-boutique-test
  namespace: gateway
spec:
  secretName: wildcard-tls
  dnsNames:
    - "*.boutique.test"
  duration: 2160h                  # 90 days, renewed by cert-manager
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: boutique-ca
