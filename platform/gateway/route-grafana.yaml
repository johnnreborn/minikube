# grafana.boutique.test -> observability/grafana (namespace labelled gateway-access=true)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.boutique.test
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: grafana
          port: 80
