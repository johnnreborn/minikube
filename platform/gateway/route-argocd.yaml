# Argo CD runs with server.insecure=true; TLS ends at the Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: gateway
      sectionName: https
  hostnames:
    - argocd.boutique.test
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
