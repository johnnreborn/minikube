# Gateway API standard-channel CRDs, vendored unmodified (SPEC §6.2, ARCHITECTURE §15-3).
# Version and channel: versions.env GATEWAY_API_VERSION / GATEWAY_API_CHANNEL (scripts/check-versions.sh verifies the
# bundle-version / channel annotations of every file). The 7 CRDs are the list Cilium 1.20 requires.
# Source: https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/<GATEWAY_API_VERSION>/config/crd/<channel>/
# Must be applied server-side (the CRDs exceed the client-side apply annotation limit).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# never prune a CRD from Argo CD: deleting it deletes every object of that kind (ARCHITECTURE §10.2)
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
resources:
  - gateway.networking.k8s.io_gatewayclasses.yaml
  - gateway.networking.k8s.io_gateways.yaml
  - gateway.networking.k8s.io_httproutes.yaml
  - gateway.networking.k8s.io_referencegrants.yaml
  - gateway.networking.k8s.io_grpcroutes.yaml
  - gateway.networking.k8s.io_backendtlspolicies.yaml
  - gateway.networking.k8s.io_tlsroutes.yaml
