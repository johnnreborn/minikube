# adservice: in from frontend, frontend-canary on 9555 (L7 allowlist)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: adservice
spec:
  description: "adservice: in from frontend, frontend-canary on 9555 (L7 allowlist)"
  endpointSelector:
    matchLabels:
      app: adservice
  ingress:
    - fromEndpoints:          # SPEC §5.6 #4
        - matchExpressions:
            - key: app
              operator: In
              values: [frontend, frontend-canary]
      toPorts:
        - ports:
            - port: "9555"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: '/hipstershop\.AdService/GetAds'
