# emailservice: in from checkoutservice on 8080 (L7 allowlist)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: emailservice
spec:
  description: "emailservice: in from checkoutservice on 8080 (L7 allowlist)"
  endpointSelector:
    matchLabels:
      app: emailservice
  ingress:
    - fromEndpoints:          # SPEC §5.6 #16
        - matchLabels:
            app: checkoutservice
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: '/hipstershop\.EmailService/SendOrderConfirmation'
  egress:
    - toEndpoints:            # OTLP traces (SPEC §5.6 #20)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
