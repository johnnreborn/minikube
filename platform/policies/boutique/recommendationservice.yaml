# recommendationservice: in from frontend, frontend-canary on 8080 (L7)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: recommendationservice
spec:
  description: "recommendationservice: in from frontend, frontend-canary on 8080 (L7)"
  endpointSelector:
    matchLabels:
      app: recommendationservice
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values: [frontend, frontend-canary]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - {}
  egress:
    - toEndpoints:
        - matchLabels:
            app: productcatalogservice
      toPorts:
        - ports:
            - port: "3550"
              protocol: TCP
    - toEndpoints:            # OTLP traces (SPEC §5.6 #20)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
