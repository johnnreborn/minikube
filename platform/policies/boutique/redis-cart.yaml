# redis-cart: in from cartservice on 6379
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-cart
spec:
  description: "redis-cart: in from cartservice on 6379"
  endpointSelector:
    matchLabels:
      app: redis-cart
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: cartservice
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
