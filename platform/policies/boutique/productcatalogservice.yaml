# productcatalogservice: in from frontend, frontend-canary, checkoutservice, recommendationservice on 3550 (L7 allowlist)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: productcatalogservice
spec:
  description: "productcatalogservice: in from frontend, frontend-canary, checkoutservice, recommendationservice on 3550 (L7 allowlist)"
  endpointSelector:
    matchLabels:
      app: productcatalogservice
  ingress:
    - fromEndpoints:          # SPEC §5.6 #8
        - matchExpressions:
            - key: app
              operator: In
              values: [frontend, frontend-canary]
      toPorts:
        - ports:
            - port: "3550"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: '/hipstershop\.ProductCatalogService/ListProducts'
              - method: POST
                path: '/hipstershop\.ProductCatalogService/GetProduct'
    - fromEndpoints:          # SPEC §5.6 #12
        - matchLabels:
            app: checkoutservice
      toPorts:
        - ports:
            - port: "3550"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: '/hipstershop\.ProductCatalogService/GetProduct'
    - fromEndpoints:          # SPEC §5.6 #17
        - matchLabels:
            app: recommendationservice
      toPorts:
        - ports:
            - port: "3550"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: '/hipstershop\.ProductCatalogService/ListProducts'
  egress:
    - toEndpoints:            # OTLP traces (SPEC §5.6 #20)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
