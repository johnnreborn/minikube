# boutique isolation (SPEC §5.6, ARCHITECTURE §8.2): default deny + DNS + one CiliumNetworkPolicy per workload with its
# allowed callers (ingress, container ports) and callees (egress). L7 rules sit on the callee side only, so a call
# passes one proxy. Platform-owned: the `apps` AppProject cannot create policy objects.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
  - default-deny.yaml
  - dns.yaml
  - frontend.yaml
  - loadgenerator.yaml
  - adservice.yaml
  - cartservice.yaml
  - checkoutservice.yaml
  - currencyservice.yaml
  - emailservice.yaml
  - paymentservice.yaml
  - productcatalogservice.yaml
  - recommendationservice.yaml
  - shippingservice.yaml
  - redis-cart.yaml
