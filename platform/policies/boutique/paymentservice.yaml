# paymentservice: in from checkoutservice on 50051 (L7)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paymentservice
spec:
  description: "paymentservice: in from checkoutservice on 50051 (L7)"
  endpointSelector:
    matchLabels:
      app: paymentservice
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: checkoutservice
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
          rules:
            http:
              - {}
  egress:
    - toEndpoints:            # OTLP traces (SPEC §5.6 #20)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
