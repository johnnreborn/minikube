# cartservice: in from frontend, frontend-canary, checkoutservice on 7070 (L7)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cartservice
spec:
  description: "cartservice: in from frontend, frontend-canary, checkoutservice on 7070 (L7)"
  endpointSelector:
    matchLabels:
      app: cartservice
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values: [frontend, frontend-canary, checkoutservice]
      toPorts:
        - ports:
            - port: "7070"
              protocol: TCP
          rules:
            http:
              - {}
  egress:
    - toEndpoints:
        - matchLabels:
            app: redis-cart
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
