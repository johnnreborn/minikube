# checkoutservice: in from frontend, frontend-canary on 5050 (L7)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: checkoutservice
spec:
  description: "checkoutservice: in from frontend, frontend-canary on 5050 (L7)"
  endpointSelector:
    matchLabels:
      app: checkoutservice
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values: [frontend, frontend-canary]
      toPorts:
        - ports:
            - port: "5050"
              protocol: TCP
          rules:
            http:
              - {}
  egress:
    - toEndpoints:
        - matchLabels:
            app: cartservice
      toPorts:
        - ports:
            - port: "7070"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: currencyservice
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: productcatalogservice
      toPorts:
        - ports:
            - port: "3550"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: shippingservice
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: paymentservice
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: emailservice
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:            # OTLP traces (SPEC §5.6 #20)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
