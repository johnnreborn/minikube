# currencyservice: in from frontend, frontend-canary, checkoutservice on 7000 (L7 allowlist)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: currencyservice
spec:
  description: "currencyservice: in from frontend, frontend-canary, checkoutservice on 7000 (L7 allowlist)"
  endpointSelector:
    matchLabels:
      app: currencyservice
  ingress:
    - fromEndpoints:          # SPEC §5.6 #7
        - matchExpressions:
            - key: app
              operator: In
              values: [frontend, frontend-canary]
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: '/hipstershop\.CurrencyService/GetSupportedCurrencies'
              - method: POST
                path: '/hipstershop\.CurrencyService/Convert'
    - fromEndpoints:          # SPEC §5.6 #13
        - matchLabels:
            app: checkoutservice
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: '/hipstershop\.CurrencyService/Convert'
  egress:
    - toEndpoints:            # OTLP traces (SPEC §5.6 #20)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
