# SPEC §5.6 platform table: Argo CD UI through the Gateway and Prometheus scrapes of each component's metrics port.
# kubelet probes (host) are always allowed; `kubectl port-forward` reaches the pod on localhost (not policed).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: server-from-gateway
spec:
  description: "argocd-server through the shared Gateway (reserved:ingress)"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-application-controller
spec:
  description: "Prometheus scrapes argocd-application-controller metrics"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-application-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
---
apiVersion: cilium.io/v2
