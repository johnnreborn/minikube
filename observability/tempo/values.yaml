# Tempo, single binary with local storage (SPEC §5.7, ADR-0009). Chart: versions.env TEMPO_CHART_VERSION (Tempo 3.x;
# keys re-checked against this chart in Phase 7).
fullnameOverride: tempo                  # Service tempo:3200 (query), :4317 (OTLP gRPC)
tempo:
  retention: 24h                         # AC-7.8 (backend_scheduler compaction block_retention)
  reportingEnabled: false
  # receivers: chart defaults. Only OTLP is used; the chart's templates require the jaeger keys, so they stay.
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 1Gi}
persistence:
  enabled: true
  storageClassName: standard
  size: 10Gi
nodeSelector:
  node.boutique.io/pool: infra
tolerations:
  - key: node.boutique.io/dedicated
    operator: Equal
    value: infra
    effect: NoSchedule
serviceMonitor:
  enabled: true
