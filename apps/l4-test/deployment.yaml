# agnhost netexec: /hostname (which backend), /clientip (source address the backend sees).
# One replica per zone (= per app node): echo-local over L2 only works while every app node has a ready backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0            # replace in place, one zone at a time (a surge pod would also be schedulable: maxSkew 1)
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: echo
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node.boutique.io/pool: app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: echo
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netexec
          image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hostname
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
