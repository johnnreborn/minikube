# 3 replicas, one per zone (AC-5.2); the target of the east-west L7 load-balancing experiment (Phase 6)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
spec:
  replicas: 3
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          # a dead node's zone must not count, or the replacement pod stays Pending (ADR-0013)
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: productcatalogservice
          matchLabelKeys:
            - pod-template-hash
