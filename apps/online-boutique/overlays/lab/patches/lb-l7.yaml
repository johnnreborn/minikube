# East-West L7 load balancing for productcatalogservice (AC-6.11, SPEC §5.5): the node's Envoy balances per request.
# Needs Cilium loadBalancer.l7.backend=envoy (platform/cilium/values.yaml).
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  annotations:
    service.cilium.io/lb-l7: enabled
---
# Every gRPC client of productcatalogservice keeps long-lived HTTP/2 connections, so a connection made before L7 LB was
# enabled would keep bypassing Envoy: the pod-template annotation rolls the clients once, through Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    metadata:
      annotations:
        boutique.test/lb-l7: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-canary
spec:
  template:
    metadata:
      annotations:
        boutique.test/lb-l7: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
spec:
  template:
    metadata:
      annotations:
        boutique.test/lb-l7: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
spec:
  template:
    metadata:
      annotations:
        boutique.test/lb-l7: enabled
