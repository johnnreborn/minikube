# Tracing (SPEC §5.9). Env names and the supporting services checked against Online Boutique v0.10.7 sources and its
# kustomize google-cloud-operations component: cartservice, shippingservice and adservice have no ENABLE_TRACING.
# ENABLE_PROFILER (also set by that component) is the Google Cloud profiler and stays off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: ENABLE_TRACING
              value: "1"
            - name: COLLECTOR_SERVICE_ADDR
              value: otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: frontend
---
